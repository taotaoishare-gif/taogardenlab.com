<script>
"use strict";
/* ============================================================================
   數字框景 V5 — Somatic Garden
   Vanilla JS · Canvas2D · Web Audio · MediaPipe Hands
   ========================================================================== */

/* -------------------- Global config -------------------- */
const MIRROR = true;            // display is mirrored (selfie). Flip if hands feel swapped.
const SEED = 20240501;
const PENT = [146.83, 164.81, 185.00, 220.00, 246.94]; // D3 E3 F#3 A3 B3 (D-Major pentatonic)
const FRACT_SPEED = 15;         // px/detection-frame threshold for "plucking"
const FRACT_RADIUS = 26;        // proximity radius around fingertip
const MAX_FRACT_PER_FRAME = 12;

const COL = {
  bg:'#060b06', jade:'rgba(159,224,178,', jadeSoft:'rgba(111,191,148,',
  shard:'#c6f7d6', bambooDark:'#2a5a3e', bambooLite:'#67b389',
  frame:'rgba(200,220,180,', gold:'rgba(216,201,138,'
};

/* -------------------- Canvas -------------------- */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W=0, H=0, DPR=1;
let cx=0, cy=0, R=0;

function sizeCanvas(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W*DPR);
  canvas.height = Math.round(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx = W*0.5; cy = H*0.5;
  R = Math.min(W,H)*0.38;
}

/* -------------------- Deterministic PRNG -------------------- */
function mulberry32(a){
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

/* -------------------- One Euro Filter (landmark low-pass) -------------------- */
class LowPass{
  constructor(){ this.s=null; }
  filter(v,a){ this.s = (this.s===null)? v : a*v+(1-a)*this.s; return this.s; }
}
class OneEuro{
  constructor(minCut=1.4, beta=0.6, dCut=1.0){
    this.minCut=minCut; this.beta=beta; this.dCut=dCut;
    this.x=new LowPass(); this.dx=new LowPass(); this.last=null;
  }
  alpha(cut,dt){ const tau=1/(2*Math.PI*cut); return 1/(1+tau/dt); }
  filter(v,t){
    let dt = (this.last!==null && t>this.last)? (t-this.last) : 1/60;
    this.last=t;
    const prev = this.x.s===null? v : this.x.s;
    const dv = (v-prev)/dt;
    const edv = this.dx.filter(dv, this.alpha(this.dCut,dt));
    const cut = this.minCut + this.beta*Math.abs(edv);
    return this.x.filter(v, this.alpha(cut,dt));
  }
}
const filters = new Map();
function smooth(key,val,t){
  let f=filters.get(key);
  if(!f){ f=new OneEuro(1.4,0.6,1.0); filters.set(key,f); }
  return f.filter(val,t);
}

/* -------------------- Geometry: Octagon frame -------------------- */
let octVerts=[];
function buildOctagon(){
  octVerts=[];
  for(let i=0;i<8;i++){
    const ang = Math.PI/8 + i*Math.PI/4;
    octVerts.push({ x: cx + R*Math.cos(ang), y: cy + R*Math.sin(ang) });
  }
}
function octPath(scale){
  ctx.beginPath();
  for(let i=0;i<octVerts.length;i++){
    const vx = cx + (octVerts[i].x-cx)*scale;
    const vy = cy + (octVerts[i].y-cy)*scale;
    if(i===0) ctx.moveTo(vx,vy); else ctx.lineTo(vx,vy);
  }
  ctx.closePath();
}
function polyArea(p){
  let a=0;
  for(let i=0,j=p.length-1;i<p.length;j=i++) a += p[j].x*p[i].y - p[i].x*p[j].y;
  return Math.abs(a)/2;
}

/* -------------------- Ice-Splinter (冰裂纹) recursive subdivision -------------------- */
let latticeSegments=[];
function buildLattice(){
  latticeSegments=[];
  const rng = mulberry32(SEED);
  const total = polyArea(octVerts);
  const MIN_AREA = total*0.014;
  const raw = [];  // {ax,ay,bx,by}

  function lerpPt(a,b,t){ return { x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t }; }

  function subdivide(poly, depth){
    const n = poly.length;
    if(depth<=0 || n<4 || polyArea(poly) < MIN_AREA){ return; }
    // occasional early stop → varied cell sizes (authentic irregularity)
    if(depth<4 && polyArea(poly) < MIN_AREA*2.2 && rng()<0.20) return;

    const i = Math.floor(rng()*n);
    const off = 2 + Math.floor(rng()*(n-3));      // [2, n-2]
    const j = (i+off)%n;
    const t = 0.32 + rng()*0.36;
    const s = 0.32 + rng()*0.36;
    const A = lerpPt(poly[i], poly[(i+1)%n], t);
    const B = lerpPt(poly[j], poly[(j+1)%n], s);

    raw.push({ax:A.x,ay:A.y,bx:B.x,by:B.y});

    const p1=[A]; let k=(i+1)%n;
    while(true){ p1.push(poly[k]); if(k===j) break; k=(k+1)%n; }
    p1.push(B);
    const p2=[B]; k=(j+1)%n;
    while(true){ p2.push(poly[k]); if(k===i) break; k=(k+1)%n; }
    p2.push(A);

    subdivide(p1, depth-1);
    subdivide(p2, depth-1);
  }

  subdivide(octVerts.slice(), 6);

  // boundary edges become part of the lattice too
  for(let i=0;i<octVerts.length;i++){
    const a=octVerts[i], b=octVerts[(i+1)%octVerts.length];
    raw.push({ax:a.x,ay:a.y,bx:b.x,by:b.y});
  }

  latticeSegments = raw.map(s=>({
    ax:s.ax, ay:s.ay, bx:s.bx, by:s.by,
    fractured:false, particles:null,
    ph: Math.random()*Math.PI*2   // turbulence phase
  }));
}

/* -------------------- Bamboo (借景) scenery -------------------- */
let stalks=[], motes=[];
function buildBamboo(){
  const rng = mulberry32(SEED^0x9e37);
  stalks=[]; motes=[];
  const n=6;
  for(let i=0;i<n;i++){
    stalks.push({
      baseX: cx + (i/(n-1)-0.5)*R*1.5,
      phase: rng()*Math.PI*2,
      hue: 0.35+rng()*0.3,
      width: 3.2+rng()*2.4,
      curve: (rng()-0.5)*0.4
    });
  }
  for(let i=0;i<64;i++){
    motes.push({
      x: cx + (rng()-0.5)*R*1.9,
      y: cy + (rng()-0.5)*R*1.9,
      p: rng()*Math.PI*2,
      r: 0.8+rng()*1.8,
      sp: 0.2+rng()*0.5
    });
  }
}

function buildScene(){
  sizeCanvas();
  buildOctagon();
  buildLattice();
  buildBamboo();
}

/* -------------------- Hand state -------------------- */
const RH = {x:0,y:0,px:0,py:0,vx:0,vy:0,speed:0,present:false,tips:null,dx:0,dy:0};
const LH = {x:0,y:0,present:false,tips:null,dx:0,dy:0};
let leftBuf=[];
let leftVibratoRaw=0, leftVibrato=0, turbulence=0;
let rightSpeed=0;

/* -------------------- Physics helpers -------------------- */
function segIntersect(p1,p2,p3,p4){
  const d=(p2.x-p1.x)*(p4.y-p3.y)-(p2.y-p1.y)*(p4.x-p3.x);
  if(Math.abs(d)<1e-9) return false;
  const t=((p3.x-p1.x)*(p4.y-p3.y)-(p3.y-p1.y)*(p4.x-p3.x))/d;
  const u=((p3.x-p1.x)*(p2.y-p1.y)-(p3.y-p1.y)*(p2.x-p1.x))/d;
  return t>=0&&t<=1&&u>=0&&u<=1;
}
function distToSeg(px,py,seg){
  const dx=seg.bx-seg.ax, dy=seg.by-seg.ay;
  const l2=dx*dx+dy*dy;
  let t = l2>0 ? ((px-seg.ax)*dx+(py-seg.ay)*dy)/l2 : 0;
  t=Math.max(0,Math.min(1,t));
  const qx=seg.ax+t*dx, qy=seg.ay+t*dy;
  return Math.hypot(px-qx, py-qy);
}

/* -------------------- Fracture (破冰) -------------------- */
function fractureSegment(seg,vx,vy,energy){
  seg.fractured=true; seg.particles=[];
  const len=Math.hypot(seg.bx-seg.ax, seg.by-seg.ay);
  const n=Math.max(5, Math.min(30, Math.floor(len/6)));
  const mag=Math.hypot(vx,vy)||1;
  const dirx=vx/mag, diry=vy/mag;
  const nx=-diry, ny=dirx;                 // perpendicular scatter axis
  for(let k=0;k<n;k++){
    const tt = n>1? k/(n-1) : 0.5;
    const ox=seg.ax+(seg.bx-seg.ax)*tt;
    const oy=seg.ay+(seg.by-seg.ay)*tt;
    const scatter=(Math.random()-0.5);
    const sp=(0.15+Math.random()*0.55)*Math.min(energy,42)*0.18;
    seg.particles.push({
      x:ox, y:oy, ox, oy,
      vx: dirx*sp + nx*scatter*sp*1.4 + (Math.random()-0.5)*0.7,
      vy: diry*sp + ny*scatter*sp*1.4 + (Math.random()-0.5)*0.7,
      tw: Math.random()*Math.PI*2
    });
  }
}
function pickNote(y){
  const idx = Math.floor((1 - Math.max(0,Math.min(1, y/H))) * PENT.length);
  return PENT[Math.max(0, Math.min(PENT.length-1, idx))];
}
function doFracture(x0,y0,x1,y1,vx,vy,speed){
  let count=0;
  const p1={x:x0,y:y0}, p2={x:x1,y:y1};
  for(const seg of latticeSegments){
    if(seg.fractured) continue;
    const A={x:seg.ax,y:seg.ay}, B={x:seg.bx,y:seg.by};
    if(segIntersect(p1,p2,A,B) || distToSeg(x1,y1,seg) < FRACT_RADIUS){
      fractureSegment(seg,vx,vy,speed);
      count++;
      if(count>=MAX_FRACT_PER_FRAME) break;
    }
  }
  if(count>0 && audio.ready) audio.playNote(pickNote(y1));
}

/* Re-cohere phase: disperse then Lerp back to exact origin (~3.5s when calm) */
function updateParticles(){
  const calm = rightSpeed < 12;
  const attract = calm ? 0.024 : 0.004;
  const turb = turbulence;
  for(const seg of latticeSegments){
    if(!seg.fractured) continue;
    let done=true;
    for(const p of seg.particles){
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.90; p.vy *= 0.90;
      p.x += (p.ox - p.x)*attract;
      p.y += (p.oy - p.y)*attract;
      if(turb>0.01){ p.x += (Math.random()-0.5)*turb*4; p.y += (Math.random()-0.5)*turb*4; }
      const dx=p.ox-p.x, dy=p.oy-p.y;
      if(dx*dx+dy*dy > 2.2) done=false;
    }
    if(done && calm){ seg.fractured=false; seg.particles=null; }  // reformed
  }
}

/* -------------------- Audio: Synthetic Silk-String Guqin -------------------- */
const audio = {
  ctx:null, ready:false,
  master:null, comp:null, reverbIn:null, delayIn:null, delay:null, fb:null,
  voices:[], lastNote:0,

  init(){
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    const c=this.ctx;

    this.master = c.createGain(); this.master.gain.value=0.85;
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value=-18; this.comp.ratio.value=3.2; this.comp.release.value=0.35;
    this.master.connect(this.comp); this.comp.connect(c.destination);

    // Convolution reverb (procedural impulse)
    this.reverbIn = c.createGain(); this.reverbIn.gain.value=0.55;
    const conv = c.createConvolver(); conv.buffer=this._impulse(2.8, 3.2);
    this.reverbIn.connect(conv); conv.connect(this.master);

    // Feedback delay (echo tail)
    this.delayIn = c.createGain(); this.delayIn.gain.value=0.5;
    this.delay = c.createDelay(1.0); this.delay.delayTime.value=0.38;
    this.fb = c.createGain(); this.fb.gain.value=0.4;
    this.delayIn.connect(this.delay);
    this.delay.connect(this.fb); this.fb.connect(this.delay);
    this.delay.connect(this.master);
    this.delay.connect(conv);

    this.ready=true;
  },

  _impulse(sec,decay){
    const rate=this.ctx.sampleRate, len=Math.floor(rate*sec);
    const buf=this.ctx.createBuffer(2,len,rate);
    for(let ch=0;ch<2;ch++){
      const d=buf.getChannelData(ch);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
    }
    return buf;
  },

  playNote(freq){
    const c=this.ctx, now=c.currentTime;
    if(now - this.lastNote < 0.25) return;   // 250ms debounce → clean triggers
    this.lastNote=now;

    const saw=c.createOscillator(); saw.type='sawtooth'; saw.frequency.value=freq; // string snap
    const tri=c.createOscillator(); tri.type='triangle'; tri.frequency.value=freq; // wood body
    const sawG=c.createGain(); sawG.gain.value=0.55;
    const triG=c.createGain(); triG.gain.value=0.5;

    const vGain=c.createGain();
    vGain.gain.setValueAtTime(0.0001, now);
    vGain.gain.exponentialRampToValueAtTime(0.9, now+0.008);       // percussive attack
    vGain.gain.exponentialRampToValueAtTime(0.0006, now+3.2);      // resonant exp decay

    const filt=c.createBiquadFilter(); filt.type='lowpass'; filt.Q.value=1.8;
    filt.frequency.setValueAtTime(3800, now);
    filt.frequency.exponentialRampToValueAtTime(120, now+1.6);     // acoustic damping sweep

    saw.connect(sawG); tri.connect(triG);
    sawG.connect(vGain); triG.connect(vGain);
    vGain.connect(filt);
    filt.connect(this.master);
    filt.connect(this.delayIn);
    filt.connect(this.reverbIn);

    saw.start(now); tri.start(now);
    saw.stop(now+3.3); tri.stop(now+3.3);

    const voice={saw,tri};
    this.voices.push(voice);
    saw.onended=()=>{
      const i=this.voices.indexOf(voice); if(i>=0) this.voices.splice(i,1);
      try{saw.disconnect();tri.disconnect();sawG.disconnect();triG.disconnect();vGain.disconnect();filt.disconnect();}catch(e){}
    };
  },

  // Left-hand vibrato → pitch bend (揉弦) + delay feedback modulation
  modulate(v,t){
    if(!this.ready) return;
    const now=this.ctx.currentTime;
    const det = Math.sin(t*2*Math.PI*(4.5+v*3)) * (v*70); // cents
    for(const voice of this.voices){
      try{
        voice.saw.detune.setTargetAtTime(det, now, 0.012);
        voice.tri.detune.setTargetAtTime(det, now, 0.012);
      }catch(e){}
    }
    try{ this.fb.gain.setTargetAtTime(Math.min(0.35 + v*0.4, 0.72), now, 0.05); }catch(e){}
  }
};

/* -------------------- MediaPipe hand results -------------------- */
function onResults(res){
  const t = performance.now()/1000;
  let foundR=false, foundL=false;

  if(res.multiHandLandmarks && res.multiHandedness){
    for(let h=0; h<res.multiHandLandmarks.length; h++){
      const lm = res.multiHandLandmarks[h];
      let label = res.multiHandedness[h].label;      // 'Left' | 'Right'
      if(MIRROR) label = (label==='Left') ? 'Right' : 'Left';

      // smoothed fingertip (index tip = 8)
      const fx = smooth(label+'8x', lm[8].x, t);
      const fy = smooth(label+'8y', lm[8].y, t);
      const px = (1-fx)*W, py = fy*H;                // horizontal mirror

      const tips = [0,4,8,12,16,20].map(i=>{
        const sx = smooth(label+i+'x', lm[i].x, t);
        const sy = smooth(label+i+'y', lm[i].y, t);
        return { x:(1-sx)*W, y:sy*H };
      });

      if(label==='Right'){ foundR=true; handleRight(px,py,tips); }
      else               { foundL=true; handleLeft(px,py,tips); }
    }
  }
  if(!foundR){ RH.present=false; }
  if(!foundL){ LH.present=false; leftBuf.length=0; }
}

function handleRight(px,py,tips){
  const ox=RH.x, oy=RH.y, was=RH.present;
  RH.vx = was? px-ox : 0;
  RH.vy = was? py-oy : 0;
  RH.px=ox; RH.py=oy; RH.x=px; RH.y=py;
  RH.present=true; RH.tips=tips;
  RH.speed = Math.hypot(RH.vx,RH.vy);
  rightSpeed = RH.speed;
  if(was && RH.speed > FRACT_SPEED){
    doFracture(ox,oy,px,py,RH.vx,RH.vy,RH.speed);
  }
}

function handleLeft(px,py,tips){
  LH.x=px; LH.y=py; LH.present=true; LH.tips=tips;
  leftBuf.push({x:px,y:py});
  if(leftBuf.length>10) leftBuf.shift();
  let s=0;
  for(let i=1;i<leftBuf.length;i++) s += Math.hypot(leftBuf[i].x-leftBuf[i-1].x, leftBuf[i].y-leftBuf[i-1].y);
  const metric = leftBuf.length>1 ? s/(leftBuf.length-1) : 0;
  leftVibratoRaw = Math.max(0, Math.min(1, metric/18));
}

/* -------------------- Rendering -------------------- */
const startT = performance.now();
const cam = document.getElementById('cam');
let camReady=false;

function frame(){
  const t = (performance.now()-startT)/1000;

  // --- smooth global metrics ---
  const vibTarget = LH.present ? leftVibratoRaw : 0;
  leftVibrato += (vibTarget - leftVibrato)*0.08;
  turbulence  += (leftVibrato - turbulence)*0.10;
  rightSpeed  *= 0.90;                       // decays between detections → detects "stopped"
  RH.dx += (RH.x-RH.dx)*0.4; RH.dy += (RH.y-RH.dy)*0.4;
  LH.dx += (LH.x-LH.dx)*0.4; LH.dy += (LH.y-LH.dy)*0.4;

  updateParticles();
  audio.modulate(leftVibrato, t);

  /* 1 — clear */
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=COL.bg;
  ctx.fillRect(0,0,W,H);

  /* 2 — faint mirrored camera ghost (somatic presence) */
  if(camReady && cam.readyState>=2){
    ctx.save();
    ctx.globalAlpha=0.09;
    try{ ctx.filter='grayscale(0.85) brightness(0.7) contrast(1.15)'; }catch(e){}
    ctx.translate(W,0); ctx.scale(-1,1);
    ctx.drawImage(cam,0,0,W,H);
    ctx.restore();
    ctx.filter='none';
    ctx.fillStyle='rgba(8,20,12,0.18)';
    ctx.fillRect(0,0,W,H);
  }

  /* 3 — ambient noise lines OUTSIDE the frame (peripheral quieting) */
  drawAmbientNoise(t);

  /* 4 — inside the Computational Frame (借景 + grillwork), clipped */
  ctx.save();
  octPath(1.0); ctx.clip();
  drawInnerBackdrop();
  drawBamboo(t);
  drawLattice(t);
  ctx.restore();

  /* 5 — ornamental octagon frame */
  drawFrame();

  /* 6 — shattered jade shards (unclipped → burst beyond the window) */
  drawShards();

  /* 7 — vignette to concentrate cognitive focus */
  drawVignette();

  /* 8 — hand indicators */
  drawHands();

  requestAnimationFrame(frame);
}

function drawAmbientNoise(t){
  const rng = mulberry32(SEED^0x1234);
  ctx.save();
  ctx.strokeStyle='rgba(120,180,140,0.035)';
  ctx.lineWidth=1;
  for(let i=0;i<22;i++){
    const y = rng()*H;
    const drift = Math.sin(t*0.15 + i)*8;
    ctx.beginPath();
    ctx.moveTo(0, y+drift);
    ctx.lineTo(W, y+drift*0.6);
    ctx.stroke();
  }
  ctx.restore();
}

function drawInnerBackdrop(){
  const g=ctx.createRadialGradient(cx,cy,R*0.1, cx,cy,R*1.1);
  g.addColorStop(0,'rgba(14,30,20,0.55)');
  g.addColorStop(1,'rgba(6,12,8,0.85)');
  ctx.fillStyle=g;
  ctx.fillRect(cx-R*1.2, cy-R*1.2, R*2.4, R*2.4);
}

function drawBamboo(t){
  const sway0 = Math.sin(t*2*Math.PI*0.15);          // 0.15Hz circadian sway
  ctx.save();
  ctx.globalCompositeOperation='lighter';

  // stalks
  for(const s of stalks){
    const amp = 12 + turbulence*46;
    ctx.lineWidth = s.width;
    const grad = ctx.createLinearGradient(0, cy+R, 0, cy-R);
    grad.addColorStop(0, COL.bambooDark);
    grad.addColorStop(1, COL.bambooLite);
    ctx.strokeStyle=grad;
    ctx.beginPath();
    let first=true;
    for(let hh=0; hh<=1.001; hh+=0.05){
      const y = (cy+R) - hh*(2*R);
      const hf = hh*hh;                                // more sway at the top
      const jitter = turbulence>0.02 ? Math.sin(t*22 + s.phase + hh*10)*turbulence*6 : 0;
      const x = s.baseX + Math.sin(sway0 + s.phase)*amp*hf + s.curve*R*hf + jitter;
      if(first){ ctx.moveTo(x,y); first=false; } else ctx.lineTo(x,y);
    }
    ctx.stroke();

    // leaves near canopy
    ctx.lineWidth=1.4;
    ctx.strokeStyle='rgba(120,210,150,0.5)';
    for(let l=0;l<5;l++){
      const hh=0.62+l*0.08;
      const y=(cy+R)-hh*(2*R);
      const x=s.baseX + Math.sin(sway0+s.phase)*amp*hh*hh + s.curve*R*hh*hh;
      const dir=(l%2?1:-1);
      const len=18+Math.sin(t+l)*4;
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.quadraticCurveTo(x+dir*len*0.6, y-6, x+dir*len, y-14);
      ctx.stroke();
    }
  }

  // drifting jade motes (fluid field)
  for(const m of motes){
    m.p += 0.01*m.sp;
    const dx = Math.sin(m.p)*0.6*(1+turbulence*3);
    const dy = Math.cos(m.p*0.7)*0.4*(1+turbulence*2);
    m.x += dx; m.y += dy;
    const a = 0.25 + 0.25*Math.sin(t*1.5 + m.p);
    ctx.fillStyle='rgba(160,240,190,'+a.toFixed(3)+')';
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawLattice(t){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';
  const jit = turbulence*7;   // quantum tremor amplitude

  for(const seg of latticeSegments){
    if(seg.fractured) continue;
    let ax=seg.ax, ay=seg.ay, bx=seg.bx, by=seg.by;
    if(jit>0.05){
      ax += Math.sin(t*11 + seg.ph)*jit;
      ay += Math.cos(t*9  + seg.ph)*jit;
      bx += Math.sin(t*10 + seg.ph+1.7)*jit;
      by += Math.cos(t*12 + seg.ph+1.7)*jit;
    }
    // wide soft glow
    ctx.strokeStyle=COL.jade+'0.07)';
    ctx.lineWidth=3.2;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    // bright core
    ctx.strokeStyle=COL.jade+'0.85)';
    ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }
  ctx.restore();
}

function drawFrame(){
  ctx.save();
  ctx.lineJoin='round';
  // outer glow
  ctx.strokeStyle=COL.jade+'0.10)';
  ctx.lineWidth=9; octPath(1.02); ctx.stroke();
  // main frame
  ctx.strokeStyle=COL.frame+'0.85)';
  ctx.lineWidth=3; octPath(1.0); ctx.stroke();
  // inner gold accent
  ctx.strokeStyle=COL.gold+'0.5)';
  ctx.lineWidth=1; octPath(0.955); ctx.stroke();
  // vertex ornaments
  ctx.fillStyle=COL.gold+'0.7)';
  for(const v of octVerts){
    ctx.beginPath(); ctx.arc(v.x,v.y,3,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawShards(){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(const seg of latticeSegments){
    if(!seg.fractured || !seg.particles) continue;
    for(const p of seg.particles){
      // halo
      ctx.fillStyle='rgba(180,245,205,0.13)';
      ctx.beginPath(); ctx.arc(p.x,p.y,3.2,0,Math.PI*2); ctx.fill();
      // core
      ctx.fillStyle=COL.shard;
      ctx.beginPath(); ctx.arc(p.x,p.y,1.3,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawVignette(){
  const g=ctx.createRadialGradient(cx,cy,R*0.9, cx,cy,Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(6,11,6,0)');
  g.addColorStop(1,'rgba(3,6,4,0.82)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

function drawHands(){
  ctx.save();
  ctx.globalCompositeOperation='lighter';

  // RIGHT — plucking energy node + motion trail
  if(RH.present){
    if(RH.speed>3){
      ctx.strokeStyle='rgba(230,200,150,0.4)';
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(RH.px,RH.py); ctx.lineTo(RH.x,RH.y); ctx.stroke();
    }
    const r = 7 + Math.min(RH.speed*0.25, 22);
    const g=ctx.createRadialGradient(RH.dx,RH.dy,0, RH.dx,RH.dy,r*2.4);
    g.addColorStop(0,'rgba(255,230,170,0.55)');
    g.addColorStop(1,'rgba(255,220,150,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(RH.dx,RH.dy,r*2.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,240,200,0.9)';
    ctx.beginPath(); ctx.arc(RH.dx,RH.dy,3.2,0,Math.PI*2); ctx.fill();
    drawTips(RH.tips,'rgba(230,205,150,0.5)');
  }

  // LEFT — resonance ring pulsing with vibrato
  if(LH.present){
    const rr = 14 + leftVibrato*30;
    ctx.strokeStyle='rgba(150,230,180,'+(0.3+leftVibrato*0.5).toFixed(3)+')';
    ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(LH.dx,LH.dy,rr,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='rgba(150,230,180,0.18)';
    ctx.beginPath(); ctx.arc(LH.dx,LH.dy,rr+8+leftVibrato*16,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='rgba(190,245,210,0.9)';
    ctx.beginPath(); ctx.arc(LH.dx,LH.dy,3,0,Math.PI*2); ctx.fill();
    drawTips(LH.tips,'rgba(150,220,175,0.5)');
  }
  ctx.restore();
}
function drawTips(tips,color){
  if(!tips) return;
  ctx.fillStyle=color;
  for(let i=1;i<tips.length;i++){
    ctx.beginPath(); ctx.arc(tips[i].x,tips[i].y,2.2,0,Math.PI*2); ctx.fill();
  }
}

/* -------------------- Camera + MediaPipe boot -------------------- */
let hands=null, mpCam=null;
function setupTracking(){
  return new Promise((resolve,reject)=>{
    if(typeof Hands==='undefined' || typeof Camera==='undefined'){
      reject(new Error('MediaPipe libraries failed to load (check network / CDN).')); return;
    }
    hands = new Hands({ locateFile:(f)=>`/vendor/mediapipe/hands/${f}` });
    hands.setOptions({
      maxNumHands:2, modelComplexity:1,
      minDetectionConfidence:0.6, minTrackingConfidence:0.6,
      selfieMode:false
    });
    hands.onResults(onResults);

    mpCam = new Camera(cam, {
      onFrame: async ()=>{ try{ await hands.send({image:cam}); }catch(e){} },
      width:1280, height:720
    });
    mpCam.start().then(()=>{ camReady=true; resolve(); }).catch(reject);
  });
}

/* -------------------- Entry / lifecycle -------------------- */
const veil=document.getElementById('veil');
const enterBtn=document.getElementById('enter');
const statusEl=document.getElementById('status');
function setStatus(msg,err){
  statusEl.textContent=msg;
  statusEl.classList.add('show');
  statusEl.classList.toggle('err',!!err);
}

let entered=false;
async function enter(){
  if(entered) return; entered=true;
  enterBtn.disabled=true;
  setStatus('喚醒聽覺… awakening audio');
  try{ audio.init(); if(audio.ctx.state==='suspended') await audio.ctx.resume(); }
  catch(e){ setStatus('AudioContext unavailable in this browser.',true); entered=false; enterBtn.disabled=false; return; }

  setStatus('喚醒感知… awakening perception (allow camera)');
  try{ await setupTracking(); }
  catch(e){ setStatus((e.message||'Camera / tracking failed.')+' — allow camera & reload.',true); entered=false; enterBtn.disabled=false; return; }

  setStatus('進入中…');
  veil.classList.add('gone');
  setTimeout(()=>{ veil.style.display='none'; }, 1500);
}
enterBtn.addEventListener('click', enter);

/* resize (debounced) */
let rz;
window.addEventListener('resize', ()=>{
  clearTimeout(rz);
  rz=setTimeout(()=>{ buildScene(); }, 180);
});

/* boot: scene animates behind the veil immediately */
buildScene();
requestAnimationFrame(frame);
</script>
