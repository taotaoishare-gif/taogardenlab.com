  星河拉坯 · 抟星作瓷  Cosmic Pottery v1
  「埏埴以为器，当其无，有器之用。」— 《道德经·十一章》
  自星河中掬一颗星，置于轮上；双手虚捧，缓缓开合。
  收拢成颈，磬音高越；张开成腹，琴音低回。
  心不静，瓷必歪；静心为釉，急躁为裂。
  All camera processing runs locally. TAO Garden 2026-07.

<style>

<script>
'use strict';
/* ============================================================
   星河拉坯 · Cosmic Pottery v1 — TAO Garden
   掬星 → 点香 → 拉坯 → 成器
   ============================================================ */
const cvs = document.getElementById('stage');
const ctx = cvs.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const TAU = Math.PI*2;
let W = 0, H = 0;

const clamp = (v,a,b) => v<a ? a : (v>b ? b : v);
const lerp  = (a,b,t) => a + (b-a)*t;
const easeIO = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
function hexRgb(hex){
  const n = parseInt(hex.slice(1),16);
  return `${(n>>16)&255},${(n>>8)&255},${n&255}`;
}

/* ———————— 全局状态 ———————— */

const pointers = [[],[]].map(() => ({

}));

/* ============================================================
   星球谱：名 · 古称 · 色釉 · 纹理 · 疗愈文案

const PLANETS = [
  { id:'moon',    cn:'月球', alias:'广寒', en:'MOON',    kind:'craters', ring:false, size:.046, cool:false,

/* ============================================================
   预渲染精灵：辉光 · 星球 · 釉纹
   ============================================================ */
function makeGlow(rgb){
  const n = document.createElement('canvas'); n.width = n.height = 128;
  const c = n.getContext('2d');
  const g = c.createRadialGradient(64,64,2,64,64,62);
  g.addColorStop(0,`rgba(${rgb},.5)`);
  g.addColorStop(.5,`rgba(${rgb},.14)`);
  g.addColorStop(1,`rgba(${rgb},0)`);
  c.fillStyle = g; c.fillRect(0,0,128,128);
  return n;
}
const GLOW_GOLD = makeGlow('222,190,120');
const GLOW_BLUE = makeGlow('120,170,215');
const GLOW_JADE = makeGlow('150,205,180');
const GLOW_RED  = makeGlow('214,84,52');

/* ——— 星球精灵：球体 + 纹理 + 晨昏线（土星附环）——— */
function makePlanetSprite(cfg){
  const S = 200, R = 62;
  const n = document.createElement('canvas');
  n.width = cfg.ring ? 320 : S; n.height = S;
  const c = n.getContext('2d');
  const cx = n.width/2, cy = S/2;

  function ringArcs(front){
    c.save();
    c.translate(cx,cy); c.rotate(-.42); c.scale(1,.30);
    const a0 = front ? 0 : Math.PI, a1 = front ? Math.PI : TAU;
    for(let k=0;k<5;k++){
      const rr = R*(1.42+k*.13);
      c.strokeStyle = k%2 ? `rgba(${cfg.midRgb},.55)` : `rgba(${cfg.hiRgb},.7)`;
      c.lineWidth = k===2 ? 2 : 4.5;
      c.beginPath(); c.arc(0,0,rr,a0,a1); c.stroke();
    }
    c.restore();
  }
  if(cfg.ring) ringArcs(false);

  /* 球体基底 */
  c.save();
  c.beginPath(); c.arc(cx,cy,R,0,TAU); c.clip();
  const g = c.createRadialGradient(cx-R*.38,cy-R*.4,R*.1,cx,cy,R*1.05);
  g.addColorStop(0,cfg.hi); g.addColorStop(.55,cfg.mid); g.addColorStop(1,cfg.lo);
  c.fillStyle = g; c.fillRect(cx-R,cy-R,R*2,R*2);

  /* 纹理 */
  if(cfg.kind==='bands'){
    for(let i=0;i<7;i++){
      const yy = cy - R + (i+.5)*(R*2/7);
      c.fillStyle = i%2 ? `rgba(${cfg.loRgb},.22)` : `rgba(${cfg.hiRgb},.18)`;
      c.beginPath();
      c.ellipse(cx, yy + Math.sin(i*2.1)*3, R, R*.13, 0, 0, TAU); c.fill();
    }
    if(cfg.id==='jupiter'){
      c.fillStyle = 'rgba(179,74,48,.85)';
      c.beginPath(); c.ellipse(cx-R*.3, cy+R*.28, R*.26, R*.15, -.2, 0, TAU); c.fill();
      c.fillStyle = 'rgba(240,210,180,.4)';
      c.beginPath(); c.ellipse(cx-R*.34, cy+R*.25, R*.1, R*.06, -.2, 0, TAU); c.fill();
    }
  } else if(cfg.kind==='craters'){
    for(let i=0;i<14;i++){
      const a = Math.random()*TAU, rr = Math.random()*R*.8;
      const x = cx + Math.cos(a)*rr, y = cy + Math.sin(a)*rr;
      const cr = 2.5 + Math.random()*7;
      c.fillStyle = 'rgba(0,0,10,.16)';
      c.beginPath(); c.arc(x,y,cr,0,TAU); c.fill();
      c.strokeStyle = 'rgba(255,255,245,.12)'; c.lineWidth = 1;
      c.beginPath(); c.arc(x,y,cr,Math.PI*1.05,Math.PI*1.85); c.stroke();
    }
    if(cfg.id==='pluto'){
      c.fillStyle = `rgba(${cfg.hiRgb},.5)`;
      c.beginPath(); c.ellipse(cx+R*.15, cy+R*.3, R*.42, R*.3, .3, 0, TAU); c.fill();
    }
  } else if(cfg.kind==='earth'){
    c.fillStyle = 'rgba(112,152,92,.85)';
    for(const [bx,by,br] of [[-.35,-.25,.3],[.3,.1,.26],[-.05,.42,.2],[.42,-.4,.16],[-.5,.25,.14]]){
      c.beginPath();
      c.ellipse(cx+R*bx, cy+R*by, R*br, R*br*.7, bx*2, 0, TAU); c.fill();
    }
    c.fillStyle = 'rgba(255,255,255,.26)';
    for(let i=0;i<5;i++){
      c.beginPath();
      c.ellipse(cx+(Math.random()-.5)*R*1.3, cy+(Math.random()-.5)*R*1.3,
        R*(.2+Math.random()*.25), R*.07, Math.random(), 0, TAU); c.fill();
    }
    c.fillStyle = 'rgba(255,255,255,.5)';
    c.beginPath(); c.ellipse(cx, cy-R*.92, R*.4, R*.14, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(cx, cy+R*.94, R*.34, R*.12, 0, 0, TAU); c.fill();
  } else if(cfg.kind==='streaks'){
    for(let i=0;i<4;i++){
      const yy = cy - R*.6 + i*R*.4;
      c.fillStyle = `rgba(${cfg.hiRgb},.2)`;
      c.beginPath(); c.ellipse(cx, yy, R*.95, R*.06, 0, 0, TAU); c.fill();
    }
    c.fillStyle = 'rgba(10,16,50,.5)';
    c.beginPath(); c.ellipse(cx+R*.25, cy-R*.2, R*.16, R*.1, .2, 0, TAU); c.fill();
  } else { /* plain 火星 */
    for(let i=0;i<8;i++){
      const a = Math.random()*TAU, rr = Math.random()*R*.75;
      c.fillStyle = `rgba(${cfg.loRgb},.16)`;
      c.beginPath();
      c.ellipse(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr,
        R*(.1+Math.random()*.2), R*(.06+Math.random()*.1), a, 0, TAU); c.fill();
    }
    c.fillStyle = 'rgba(255,255,255,.4)';
    c.beginPath(); c.ellipse(cx, cy-R*.92, R*.3, R*.1, 0, 0, TAU); c.fill();
  }

  /* 晨昏线 */
  const tg = c.createRadialGradient(cx+R*.5, cy+R*.42, R*.15, cx+R*.3, cy+R*.25, R*1.35);
  tg.addColorStop(0,'rgba(2,2,8,0)');
  tg.addColorStop(.62,'rgba(2,2,8,0)');
  tg.addColorStop(1,'rgba(2,2,8,.62)');
  c.fillStyle = tg; c.fillRect(cx-R,cy-R,R*2,R*2);
  c.restore();

  /* 大气微光 */
  c.strokeStyle = `rgba(${cfg.hiRgb},.5)`; c.lineWidth = 1.4;
  c.shadowColor = `rgba(${cfg.hiRgb},.8)`; c.shadowBlur = 10;
  c.beginPath(); c.arc(cx,cy,R,0,TAU); c.stroke();
  c.shadowBlur = 0;

  if(cfg.ring) ringArcs(true);
  return { cvs:n, cx, cy, R };
}

/* ——— 釉纹长卷：随轮旋转横移，贴于坯体 ——— */
function makeTexStrip(cfg){
  const TW = 512, TH = 256;
  const n = document.createElement('canvas'); n.width = TW; n.height = TH;
  const c = n.getContext('2d');
  const g = c.createLinearGradient(0,0,0,TH);
  g.addColorStop(0,cfg.hi); g.addColorStop(.5,cfg.mid); g.addColorStop(1,cfg.lo);
  c.fillStyle = g; c.fillRect(0,0,TW,TH);

  if(cfg.kind==='bands' || cfg.kind==='streaks'){
    for(let i=0;i<9;i++){
      const yy = (i+.5)*TH/9;
      c.fillStyle = i%2 ? `rgba(${cfg.loRgb},.28)` : `rgba(${cfg.hiRgb},.22)`;
      c.beginPath(); c.moveTo(0,yy);
      for(let x=0;x<=TW;x+=32)
        c.lineTo(x, yy + Math.sin(x*.02+i*2.2)*5);
      c.lineTo(TW, yy+9); c.lineTo(0, yy+9); c.closePath(); c.fill();
    }
  }
  /* 星尘釉斑（旋转时可见流动） */
  const blobN = cfg.kind==='craters' ? 30 : 46;
  for(let i=0;i<blobN;i++){
    const x = Math.random()*TW, y = Math.random()*TH;
    const rr = 5 + Math.random()*26;
    const dark = Math.random()<.5;
    c.fillStyle = dark ? `rgba(${cfg.loRgb},${.1+Math.random()*.14})`
                       : `rgba(${cfg.hiRgb},${.08+Math.random()*.12})`;
    c.beginPath(); c.ellipse(x,y,rr,rr*.55,Math.random()*3,0,TAU); c.fill();
    if(x < 40){ c.beginPath(); c.ellipse(x+TW,y,rr,rr*.55,0,0,TAU); c.fill(); }
    if(x > TW-40){ c.beginPath(); c.ellipse(x-TW,y,rr,rr*.55,0,0,TAU); c.fill(); }
  }
  /* 细密拉坯纹 */
  for(let y=6;y<TH;y+=7){
    c.strokeStyle = 'rgba(0,0,10,.07)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(0,y); c.lineTo(TW,y); c.stroke();
  }
  return n;
}

let sprites = new Map(), strips = new Map();
function buildSprites(){
  if(sprites.size) return;
  for(const p of PLANETS){
    sprites.set(p.id, makePlanetSprite(p));
    strips.set(p.id, makeTexStrip(p));
  }
}

/* ============================================================
   星河：一道流经屏幕的星尘长河
   ============================================================ */
let riverPts = [], planets = [], riverA = 1;
function riverPoint(t){
  const p0 = {x:-.06*W, y:.60*H}, p1 = {x:.30*W, y:.26*H},
        p2 = {x:.66*W, y:.72*H}, p3 = {x:1.06*W, y:.34*H};
  const u = 1-t;
  const x = u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x;
  const y = u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y;
  const dx = 3*u*u*(p1.x-p0.x) + 6*u*t*(p2.x-p1.x) + 3*t*t*(p3.x-p2.x);
  const dy = 3*u*u*(p1.y-p0.y) + 6*u*t*(p2.y-p1.y) + 3*t*t*(p3.y-p2.y);
  const dl = Math.hypot(dx,dy) || 1;
  return { x, y, nx:-dy/dl, ny:dx/dl };
}
function gauss(){ return (Math.random()+Math.random()+Math.random())/1.5 - 1; }
function buildRiver(){
  riverPts = [];
  for(let i=0;i<560;i++) riverPts.push({
    t: Math.random()*1.08 - .04,
    off: gauss()*Math.min(W,H)*.075,
    spd: .006 + Math.random()*.018,
    sz: .5 + Math.random()*1.7,
    hue: Math.random()<.5 ? 0 : (Math.random()<.6 ? 1 : 2),
    al: .06 + Math.random()*.2,
    tw: Math.random()*9
  });
  const n = PLANETS.length;
  planets = PLANETS.map((cfg,i) => ({
    cfg,
    t: -0.22 + i*(1.4/n) + (Math.random()-.5)*.012,
    spd: .0095 + Math.random()*.003,
    off: (i%2 ? 1 : -1)*(Math.min(W,H)*.055 + Math.random()*Math.min(W,H)*.055),
    bob: Math.random()*9,
    x:0, y:0, r: cfg.size*Math.min(W,H)
  }));
}
const RIVER_COL = ['150,205,180','130,180,215','226,236,230'];
function renderRiver(now, alpha){
  if(alpha <= .01) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const p of riverPts){
    p.t += p.spd*dtG*.55;
    if(p.t > 1.04){ p.t = -.04; p.off = gauss()*Math.min(W,H)*.075; }
    const pt = riverPoint(p.t);
    const x = pt.x + pt.nx*p.off, y = pt.y + pt.ny*p.off;
    const tw = .55 + .45*Math.sin(now*.0012 + p.tw);
    ctx.globalAlpha = p.al*tw*alpha;
    if(p.sz > 1.9){
      ctx.drawImage(p.hue===1?GLOW_BLUE:GLOW_JADE, x-10, y-10, 20, 20);
    } else {
      ctx.fillStyle = `rgb(${RIVER_COL[p.hue]})`;
      ctx.beginPath(); ctx.arc(x,y,p.sz,0,TAU); ctx.fill();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function updatePlanets(now){
  for(const pl of planets){
    pl.t += pl.spd*dtG;
    if(pl.t > 1.18) pl.t -= 1.4;
    const pt = riverPoint(pl.t);
    pl.x = pt.x + pt.nx*pl.off;
    pl.y = pt.y + pt.ny*pl.off + Math.sin(now*.0006 + pl.bob)*6;
  }
}
function renderPlanets(now, alpha, hoverKey){
  for(const pl of planets){
    if(chosen && pl.cfg.id === chosen.id && phase!=='select') continue;
    const sp = sprites.get(pl.cfg.id);
    const sc = pl.r/sp.R;
    ctx.save();
    ctx.globalAlpha = alpha;
    const gsz = pl.r*4.6;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha*.4;
    ctx.drawImage(pl.cfg.cool?GLOW_BLUE:GLOW_GOLD,
      pl.x-gsz/2, pl.y-gsz/2, gsz, gsz);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = alpha;
    ctx.drawImage(sp.cvs,
      pl.x - sp.cx*sc, pl.y - sp.cy*sc,
      sp.cvs.width*sc, sp.cvs.height*sc);
    if(hoverKey === pl.cfg.id){
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(223,242,232,.95)';
      ltext(ctx, L(pl.cfg.cn+' · '+pl.cfg.alias, pl.cfg.en),
        pl.x, pl.y + pl.r + 28, lang==='zh'?15:13, lang==='zh'?4:5,
        lang==='zh'?'"Songti SC","STSong",serif':'"Futura","Century Gothic","Avenir Next",sans-serif', 'center');
      ctx.fillStyle = 'rgba(200,164,95,.5)';
      ctx.font = lang==='zh'?'10px Georgia,serif':'10.5px "Songti SC","STSong",serif';
      ctx.fillText(L(pl.cfg.colorEn, pl.cfg.cn+' · '+pl.cfg.colorCn), pl.x, pl.y + pl.r + 44);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   悬停拾取：停驻即取（手与鼠标共用）
   ============================================================ */
const DWELL_NEED = 1.15;
const dwell = { key:null, t:0, tg:null };
function activePointer(){
  for(const p of pointers) if(p.active) return p;
  return null;
}
function updateDwell(dt, targets){
  const P = activePointer();
  let hit = null;
  if(P){
    for(const tg of targets){
      if(tg.rr != null){
        if(Math.hypot(P.x-tg.x, P.y-tg.y) < tg.rr){ hit = tg; break; }
      } else {
        if(P.x>tg.x0 && P.x<tg.x1 && P.y>tg.y0 && P.y<tg.y1){ hit = tg; break; }
      }
    }
  }
  if(!hit){
    dwell.t = Math.max(0, dwell.t - dt*2.2);
    if(dwell.t === 0){ dwell.key = null; dwell.tg = null; }
    return null;
  }
  if(dwell.key !== hit.key){ dwell.key = hit.key; dwell.t = 0; }
  dwell.tg = hit;
  dwell.t += dt;
  if(dwell.t >= DWELL_NEED){
    dwell.t = 0; dwell.key = null;
    const done = dwell.tg; dwell.tg = null;
    return done;
  }
  return null;
}
function renderDwell(){
  if(!dwell.tg || dwell.t <= .06) return;
  const tg = dwell.tg;
  const cx = tg.rr != null ? tg.x : (tg.x0+tg.x1)/2;
  const cy = tg.rr != null ? tg.y : (tg.y0+tg.y1)/2;
  const rr = tg.rr != null ? tg.rr + 10 : Math.min(tg.x1-tg.x0, tg.y1-tg.y0)*.2 + 26;
  const u = clamp(dwell.t/DWELL_NEED, 0, 1);
  ctx.save();
  ctx.strokeStyle = 'rgba(200,164,95,.26)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(232,199,126,.9)'; ctx.lineWidth = 2.2;
  ctx.shadowColor = 'rgba(200,164,95,.7)'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(cx, cy, rr, -Math.PI/2, -Math.PI/2 + u*TAU); ctx.stroke();
  ctx.restore();
}

/* ============================================================
   坯体：轮上的星尘素坯（法线剖面 · 归一化半径）
   ============================================================ */
const SEG = 56, EY = .2, MINRN = .12;
let prof = [], maxR = 0, vTop = 0, vBot = 0, vCx = 0;
let vH = 0, baseH = 0, vHMin = 0, vHMax = 0;   // 坯高：随手势升降
let rot = 0, spinSpd = 0, wob = 0;
let chosen = null, chooseAnim = null;
let dust = [];
const VSCR = {};   // 坯体离屏画布（复用）

/* 初坯为一颗星球：球体剖面（上下收、腰身圆） */
function initProfile(){
  prof = [];
  for(let i=0;i<SEG;i++){
    const u = i/(SEG-1);
    prof.push(0.16 + 0.84*Math.pow(Math.sin(Math.PI*u), 0.62));
  }
  vH = baseH; syncVessel();
}
function syncVessel(){ vTop = vBot - vH; }
function vesselLayout(){
  vCx = W/2;
  vBot = H*.78;
  maxR = Math.min(W*.15, H*.19);
  baseH = maxR*2;                 // 球体：高＝宽
  vHMin = maxR*1.25;
  vHMax = vBot - H*.14;           // 最高可拉至近顶
  if(!vH) vH = baseH;
  syncVessel();
}
function profAt(u){
  const f = clamp(u,0,1)*(SEG-1);
  const i = Math.floor(f), t = f-i;
  return i>=SEG-1 ? prof[SEG-1] : lerp(prof[i], prof[i+1], t);
}
function yToU(y){ return clamp((y-vTop)/(vBot-vTop), .03, .985); }

function buildDust(){
  dust = [];
  for(let i=0;i<88;i++) dust.push({
    u: Math.random(), a: Math.random()*TAU,
    w: .6 + Math.random()*.9,
    sz: .6 + Math.random()*1.5,
    tw: Math.random()*9,
    hue: Math.random()<.6
  });
}

/* ——— 塑形：双手为规，静气为度 ——— */
let emaSpd = 0, anx = 0, calmAcc = 0, calmT = 0;
let calmEarly = 0, calmEarlyT = 0, calmLate = 0, calmLateT = 0;
let anxPeak = 0, lastNote = 0, shapeIntensity = 0;
const HANDGAP = 10;            // 掌心到坯壁的贴合余量(px)
const SHAPE_RATE = 1.15;       // 塑形速率：慢工，还原真实拉坯

/* 当前塑形之手：摄像头两手各自独立着力；演示单指按住 */
function shapeHands(){
  const hs = [];
  if(cameraMode){
    for(const p of pointers) if(p.active) hs.push(p);
  } else if(pdown && pointers[0].active){
    hs.push(pointers[0]);
  }
  return hs;
}

function updateShaping(now, dt){
  const hs = shapeHands();

  /* 心气监测：手速 → 焦虑度（只计塑形之手）*/
  let v = 0;
  for(const p of hs) v += Math.hypot(p.x-p.px, p.y-p.py)/Math.max(dt,1e-3);
  if(hs.length) v /= hs.length;
  emaSpd += (v - emaSpd)*Math.min(1, dt*2.2);
  const target = clamp((emaSpd-210)/500, 0, 1);
  anx += (target - anx)*Math.min(1, dt*2.4);
  if(anx > anxPeak) anxPeak = anx;
  if(hs.length){
    calmAcc += (1-anx)*dt; calmT += dt;
    if(remainT > sessionDur*0.5){ calmEarly += (1-anx)*dt; calmEarlyT += dt; }
    else { calmLate += (1-anx)*dt; calmLateT += dt; }
  }

  /* 摇晃：心不静，瓷必歪 */
  wob += ((anx>.28 ? anx*10 : 0) - wob)*Math.min(1, dt*1.4);

  const calmF = 1/(1 + anx*2.4);      // 心浮则手滑，泥不听使唤
  let intensity = 0, bestCf = 0, bestHand = null;

  if(!finishing){
    /* 每只手在各自高度独立塑形（左右可同时控制不同部位）*/
    for(const p of hs){
      const u = yToU(p.y);
      const rnHand = clamp((Math.abs(p.x - vCx) - HANDGAP)/maxR, MINRN, 1);
      const rnBand = profAt(u);
      const diffPx = Math.abs(rnHand - rnBand)*maxR;
      const cf = clamp(1 - (diffPx-58)/150, 0, 1);   // 贴近坯面才着力
      if(cf <= 0) continue;
      const sp = Math.hypot(p.x-p.px, p.y-p.py)/Math.max(dt,1e-3);
      const rate = SHAPE_RATE*cf*calmF;
      const sig = .085;                              // 着力范围（局部）
      for(let i=0;i<SEG;i++){
        const ui = i/(SEG-1);
        const g = Math.exp(-Math.pow(ui-u,2)/(2*sig*sig));
        prof[i] += (rnHand - prof[i])*g*rate*dt;
        if(anx > .35) prof[i] += (Math.random()-.5)*anx*.32*dt*g;
      }
      intensity = Math.max(intensity, cf*clamp(sp/360,.15,1));
      if(cf > bestCf){ bestCf = cf; bestHand = {u, rnHand, rnBand, sp}; }
    }

    /* 坯高：贴壁之手向上"提"则长高，下压则矮（慢）*/
    let lift = 0, liftN = 0;
    for(const p of hs){
      const u = yToU(p.y);
      const rnHand = clamp((Math.abs(p.x - vCx) - HANDGAP)/maxR, MINRN, 1);
      if(Math.abs(rnHand - profAt(u))*maxR < 95){ lift += (p.py - p.y); liftN++; }
    }
    if(liftN){
      vH = clamp(vH + clamp(lift/liftN, -6, 6)*0.5*calmF, vHMin, vHMax);
      syncVessel();
    }

    /* 星河环佩：收细鸣磬，放宽抚琴（取着力最深之手）*/
    if(bestHand && bestCf > .25 && now - lastNote > 190 + Math.random()*120){
      const vel = clamp(.3 + bestHand.sp/500, .3, 1);
      const yh = vTop + bestHand.u*(vBot-vTop);
      if(bestHand.rnHand < bestHand.rnBand - .02){
        lastNote = now;
        playChime(clamp(Math.round((1-bestHand.rnBand)*10)+4, 0, 14), vel, (bestHand.u-.5)*.8);
        spawnSparks(vCx + bestHand.rnBand*maxR, yh, vel);
      } else if(bestHand.rnHand > bestHand.rnBand + .02){
        lastNote = now;
        playQin(clamp(Math.round((1-bestHand.rnBand)*7), 0, 9), vel*.9, (bestHand.u-.5)*.6);
        spawnSparks(vCx - bestHand.rnBand*maxR, yh, vel*.7);
      }
    }
  }
  shapeIntensity += (intensity - shapeIntensity)*Math.min(1, dt*6);
  setShapeNoise(shapeIntensity);

  /* 泥性：邻段匀滑 + 底部定盘 + 收口 */
  const sm = [];
  for(let i=0;i<SEG;i++){
    const a = prof[Math.max(0,i-1)], b = prof[i], c2 = prof[Math.min(SEG-1,i+1)];
    sm.push(a*.18 + b*.64 + c2*.18);
  }
  prof = sm;
  for(let i=SEG-3;i<SEG;i++) prof[i] = lerp(prof[i], .7, .1);       // 底盘渐定
  prof[0] = lerp(prof[0], Math.min(prof[1], .5), .1);              // 口沿不外翻
  for(let i=0;i<SEG;i++) prof[i] = clamp(prof[i], MINRN, 1);
}

/* ——— 坯体绘制（现场与海报共用）——— */
function paintVessel(c, o){
  const sf = o.sf || 1;
  const pad = o.maxR*.5 + 24;
  const ox = o.cx - o.maxR - pad, oy = o.yTop - o.maxR*EY - pad;
  const w = (o.maxR + pad)*2, h = (o.yBot - o.yTop) + o.maxR*EY + pad*2;
  const S = o.scratch;
  const needW = Math.ceil(w*sf), needH = Math.ceil(h*sf);
  if(!S.cvs || S.cvs.width !== needW || S.cvs.height !== needH){
    S.cvs = document.createElement('canvas');
    S.cvs.width = needW; S.cvs.height = needH;
    S.ctx = S.cvs.getContext('2d');
  }
  const s = S.ctx;
  s.setTransform(1,0,0,1,0,0);
  s.clearRect(0,0,S.cvs.width,S.cvs.height);
  s.setTransform(sf,0,0,sf,-ox*sf,-oy*sf);

  const n = o.prof.length;
  const ys = i => o.yTop + (i/(n-1))*(o.yBot-o.yTop);
  const rp = i => o.prof[i]*o.maxR;
  const dx = i => o.wob ? o.wob*Math.sin(o.rot*2.2 + (i/(n-1))*5.2) : 0;

  /* 剖面轮廓 */
  s.beginPath();
  s.moveTo(o.cx + dx(0) - rp(0), ys(0));
  for(let i=1;i<n;i++) s.lineTo(o.cx + dx(i) - rp(i), ys(i));
  s.ellipse(o.cx + dx(n-1), o.yBot, rp(n-1), rp(n-1)*EY, 0, Math.PI, 0, true);
  for(let i=n-1;i>=0;i--) s.lineTo(o.cx + dx(i) + rp(i), ys(i));
  s.closePath();
  const g = s.createLinearGradient(0,o.yTop,0,o.yBot);
  g.addColorStop(0,o.pal.hi); g.addColorStop(.52,o.pal.mid); g.addColorStop(1,o.pal.lo);
  s.fillStyle = g; s.fill();

  /* 旋转釉纹 */
  s.globalCompositeOperation = 'source-atop';
  if(o.tex){
    const dw = o.maxR*2.2, dh = (o.yBot-o.yTop)+30;
    const off = ((o.rot%TAU)/TAU)*dw;
    s.globalAlpha = .48;
    for(let k=-1;k<=1;k++)
      s.drawImage(o.tex, o.cx - dw*1.5 + k*dw + off, o.yTop-14, dw, dh);
    s.globalAlpha = 1;
  }
  /* 侧影与流转高光 */
  const shL = s.createLinearGradient(o.cx-o.maxR,0,o.cx,0);
  shL.addColorStop(0,'rgba(0,0,8,.5)'); shL.addColorStop(1,'rgba(0,0,8,0)');
  s.fillStyle = shL; s.fillRect(o.cx-o.maxR-o.pad||o.cx-o.maxR-30, o.yTop-20, o.maxR+30, o.yBot-o.yTop+60);
  const shR = s.createLinearGradient(o.cx+o.maxR,0,o.cx,0);
  shR.addColorStop(0,'rgba(0,0,8,.42)'); shR.addColorStop(1,'rgba(0,0,8,0)');
  s.fillStyle = shR; s.fillRect(o.cx, o.yTop-20, o.maxR+30, o.yBot-o.yTop+60);
  const hx = o.luster ? o.cx - o.maxR*.32 : o.cx + Math.sin(o.rot)*o.maxR*.45;
  const hw = o.maxR*(.5 + .2*(o.luster||0));
  const hg = s.createLinearGradient(hx-hw,0,hx+hw,0);
  const ha = .09 + .12*(o.luster||0);
  hg.addColorStop(0,'rgba(255,252,240,0)');
  hg.addColorStop(.5,`rgba(255,252,240,${ha})`);
  hg.addColorStop(1,'rgba(255,252,240,0)');
  s.fillStyle = hg; s.fillRect(hx-hw, o.yTop-20, hw*2, o.yBot-o.yTop+60);
  s.globalCompositeOperation = 'source-over';

  c.drawImage(S.cvs, ox, oy, w, h);

  /* 口沿 · 器内 · 底影（直接绘于目标） */
  const r0 = rp(0), d0 = dx(0);
  c.save();
  c.fillStyle = o.pal.lo;
  c.beginPath(); c.ellipse(o.cx+d0, o.yTop, r0, r0*EY, 0, 0, TAU); c.fill();
  c.fillStyle = 'rgba(4,4,10,.78)';
  c.beginPath(); c.ellipse(o.cx+d0, o.yTop, r0*.85, r0*EY*.8, 0, 0, TAU); c.fill();
  c.strokeStyle = o.pal.hi; c.globalAlpha = .85; c.lineWidth = 1.5;
  c.shadowColor = o.pal.hi; c.shadowBlur = 8;
  c.beginPath(); c.ellipse(o.cx+d0, o.yTop, r0, r0*EY, 0, 0, TAU); c.stroke();
  c.restore();
  const rb = rp(n-1);
  c.save();
  c.globalAlpha = .4; c.fillStyle = '#000';
  c.beginPath();
  c.ellipse(o.cx+dx(n-1), o.yBot + rb*EY*.7, rb*1.15, rb*EY*.8, 0, 0, TAU); c.fill();
  c.restore();

  /* 心浮气躁：口沿泛红 */
  if(o.anx > .04){
    c.save();
    c.strokeStyle = `rgba(214,74,48,${.7*o.anx})`;
    c.lineWidth = 2.2;
    c.shadowColor = 'rgba(214,74,48,.9)'; c.shadowBlur = 18;
    c.beginPath(); c.ellipse(o.cx+d0, o.yTop, r0+2, r0*EY+2, 0, 0, TAU); c.stroke();
    c.globalAlpha = o.anx*.5;
    const gz = o.maxR*2.2;
    c.globalCompositeOperation = 'lighter';
    c.drawImage(GLOW_RED, o.cx-gz/2, o.yTop-gz/4, gz, gz*.5);
    c.restore();
  }
}

/* ——— 轮盘 · 轮纹 · 星尘环 ——— */
function renderWheel(now){
  const wy = vBot + 12, wr = maxR*1.18;
  ctx.save();
  ctx.fillStyle = 'rgba(10,16,13,.9)';
  ctx.beginPath(); ctx.ellipse(vCx, wy, wr, wr*EY, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(200,164,95,.38)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.ellipse(vCx, wy, wr, wr*EY, 0, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(200,164,95,.15)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(vCx, wy, wr*.7, wr*EY*.7, 0, 0, TAU); ctx.stroke();
  /* 轮上流转的星点 —— 转速可视 */
  ctx.globalCompositeOperation = 'lighter';
  for(let k=0;k<3;k++){
    const a = rot*1.0 + k*TAU/3;
    ctx.globalAlpha = .5 + .3*Math.sin(a);
    ctx.fillStyle = '#a9d4c0';
    ctx.beginPath();
    ctx.arc(vCx + Math.cos(a)*wr*.86, wy + Math.sin(a)*wr*EY*.86, 1.6, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function renderVesselLive(now){

  });
  /* 轮制弦纹（前半圈） */

  ctx.strokeStyle = 'rgba(229,210,170,.09)'; ctx.lineWidth = 1;
  for(let i=3;i<SEG-3;i+=5){
    const y = vTop + (i/(SEG-1))*(vBot-vTop);
    const r = prof[i]*maxR;
    const d = wob ? wob*Math.sin(rot*2.2 + (i/(SEG-1))*5.2) : 0;
    ctx.beginPath(); ctx.ellipse(vCx+d, y, r, r*EY, 0, 0, Math.PI); ctx.stroke();
  }
  ctx.restore();
  /* 星尘绕坯 */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const d of dust){
    d.a += spinSpd*d.w*dtG;
    const r = profAt(d.u)*maxR + 3 + 2*Math.sin(now*.001+d.tw);
    const y = vTop + d.u*(vBot-vTop) + Math.sin(d.a)*r*EY*.35;
    const x = vCx + Math.cos(d.a)*r;
    const front = Math.sin(d.a) > 0;
    ctx.globalAlpha = (front ? .4 : .13)*(.6+.4*Math.sin(now*.0014+d.tw));
    ctx.fillStyle = d.hue ? chosen.hi : '#e8dcb8';
    ctx.beginPath(); ctx.arc(x, y, d.sz, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ============================================================
   火花 · 波纹（塑形回响）
   ============================================================ */
let sparks = [], rings = [], ptcls = [];
function spawnSparks(x, y, vel){
  const col = chosen ? chosen.hiRgb : '150,205,180';
  const n = 3 + Math.round(vel*5);
  for(let i=0;i<n;i++) sparks.push({
    x, y,
    vx:(Math.random()-.5)*150*(.5+vel), vy:(Math.random()-.6)*110*(.5+vel),
    t:0, life:.4+Math.random()*.4,
    c: Math.random()<.7 ? col : '150,205,180'
  });
  rings.push({x, y, r:3, a:.4, vr:90});
}
function updateFx(dt){
  for(let i=sparks.length-1;i>=0;i--){
    const p = sparks[i];
    p.t += dt; p.vy += 380*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.t > p.life) sparks.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r = rings[i];
    r.r += r.vr*dt; r.vr *= .985; r.a -= dt*.55;
    if(r.a <= 0) rings.splice(i,1);
  }
}
function renderFx(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const r of rings){
    ctx.globalAlpha = Math.max(0, r.a);
    ctx.strokeStyle = 'rgba(232,199,126,.9)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  for(const p of sparks){
    ctx.globalAlpha = Math.max(0, 1-p.t/p.life)*.8;
    ctx.fillStyle = `rgb(${p.c})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 1.4, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
/* 光标：光点拖着逐渐消散的柔性粒子，无生硬线条 */
function renderPointersFx(now){
  /* 由手的移动喷出星尘粒子 */
  for(const p of pointers){
    if(!p.active) continue;
    const dx = p.x - p.px, dy = p.y - p.py;
    const spd = Math.hypot(dx, dy);
    p._emit = (p._emit || 0) + (0.9 + Math.min(4.5, spd*0.26));
    while(p._emit >= 1 && ptcls.length < 460){
      p._emit -= 1;
      ptcls.push({
        x: p.x + (Math.random()-.5)*4,
        y: p.y + (Math.random()-.5)*4,
        vx: -dx*0.12 + (Math.random()-.5)*11,
        vy: -dy*0.12 + (Math.random()-.5)*11 - 5,
        t: 0, life: .5 + Math.random()*.55,
        sz: 2.2 + Math.random()*3.4,
        jade: Math.random() < .82
      });
    }
  }
  /* 更新 + 柔光叠加渲染，逐渐消散 */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(let i=ptcls.length-1;i>=0;i--){
    const q = ptcls[i];
    q.t += dtG;
    if(q.t >= q.life){ ptcls.splice(i,1); continue; }
    q.x += q.vx*dtG; q.y += q.vy*dtG;
    q.vx *= 0.93; q.vy *= 0.93;
    const k = 1 - q.t/q.life;
    const s = q.sz * (0.7 + k*0.9) * 6;
    ctx.globalAlpha = k*k*0.5;
    ctx.drawImage(q.jade ? GLOW_JADE : GLOW_BLUE, q.x - s/2, q.y - s/2, s, s);
  }
  /* 柔光光点（无硬边、无连线）*/
  for(const p of pointers){
    if(!p.active) continue;
    ctx.globalAlpha = .5;
    ctx.drawImage(GLOW_JADE, p.x-16, p.y-16, 32, 32);
    ctx.globalAlpha = .85;
    ctx.fillStyle = '#dff2e8';
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.3, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function renderIncense(now, dt){
  const x = W - 60;
  const y0 = H*.32, L = H*.30;
  const frac = clamp(remainT/sessionDur, 0, 1);
  const yE = y0 + (1-frac)*L;
  ctx.save();
  ctx.strokeStyle = 'rgba(96,104,98,.5)'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, yE); ctx.stroke();
  ctx.strokeStyle = 'rgba(229,210,170,.6)'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(x, yE); ctx.lineTo(x, y0+L); ctx.stroke();
  if(!finishing){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = .7 + .3*Math.sin(now*.008);
    ctx.fillStyle = '#efcf9a';
    ctx.beginPath(); ctx.arc(x, yE, 2.2, 0, TAU); ctx.fill();
    ctx.drawImage(GLOW_JADE, x-9, yE-9, 18, 18);
    ctx.restore();
    if(now - lastSmoke > 300){
      lastSmoke = now;
      smoke.push({x, y:yE-3, t:0, life:2.6+Math.random()*1.4,
        drift:(Math.random()-.5)*10, ph:Math.random()*9});
    }
  }
  for(let i=smoke.length-1;i>=0;i--){
    const s = smoke[i];
    s.t += dt;
    if(s.t > s.life){ smoke.splice(i,1); continue; }
    const u = s.t/s.life;
    ctx.globalAlpha = .22*(1-u);
    ctx.strokeStyle = '#cfc8b8'; ctx.lineWidth = 1;
    const sx = s.x + Math.sin(s.t*2.2+s.ph)*6*u + s.drift*u;
    const sy = s.y - u*54;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(sx+Math.sin(s.t*3+s.ph)*4, sy-7, sx+Math.sin(s.t*2+s.ph)*2, sy-13);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  /* 不显示数字倒计时：只保留缓缓缩短的香线，解除时间焦虑 */
  if(chosen){
    ctx.fillStyle = 'rgba(238,231,215,.55)';
    ctx.font = '12px "Futura","Century Gothic",sans-serif';
    ctx.fillText(L(`${chosen.cn} · ${chosen.alias}`, chosen.en), x, y0-26);
  }
  ctx.restore();
}

/* ============================================================
   声音：泉流为底 · 磬琴相和（全 Web Audio 合成）
   ============================================================ */
const PENTA = [0,2,4,7,9];
let actx = null, master = null, dryG = null, wetG = null;
let humG = null, humO1 = null, humO2 = null, shapeG = null, shapeF = null;

function initAudio(){
  actx = new (window.AudioContext||window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = .9;
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 4;
  master.connect(comp); comp.connect(actx.destination);
  const conv = actx.createConvolver();
  conv.buffer = makeIR(3.6, 2.2);
  wetG = actx.createGain(); wetG.gain.value = .5;
  dryG = actx.createGain(); dryG.gain.value = .78;
  wetG.connect(conv); conv.connect(master); dryG.connect(master);
  startWater(); startHum(); startShapeNoise(); scheduleDrip();
}
function makeIR(dur, decay){
  const rate = actx.sampleRate, len = Math.floor(rate*dur);
  const buf = actx.createBuffer(2, len, rate);
  for(let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    for(let i=0;i<len;i++)
      d[i] = (Math.random()*2-1)*Math.pow(1-i/len, decay);
  }
  return buf;
}
function noiseBuf(dur){
  const rate = actx.sampleRate, len = Math.floor(rate*dur);
  const buf = actx.createBuffer(1, len, rate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  return buf;
}

/* 泉水潺潺：溪声两层 + 深空底鸣 */
function startWater(){
  const nb = noiseBuf(3.1);
  const brook = actx.createBufferSource(); brook.buffer = nb; brook.loop = true;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = 640; bp.Q.value = .8;
  const bg = actx.createGain(); bg.gain.value = .0048;
  brook.connect(bp); bp.connect(bg); bg.connect(master); brook.start();
  const lfo = actx.createOscillator(); lfo.frequency.value = .13;
  const lfoG = actx.createGain(); lfoG.gain.value = 130;
  lfo.connect(lfoG); lfoG.connect(bp.frequency); lfo.start();
  const lfo2 = actx.createOscillator(); lfo2.frequency.value = .07;
  const lfo2G = actx.createGain(); lfo2G.gain.value = .002;
  lfo2.connect(lfo2G); lfo2G.connect(bg.gain); lfo2.start();

  const hiss = actx.createBufferSource(); hiss.buffer = nb; hiss.loop = true;
  const bp2 = actx.createBiquadFilter(); bp2.type = 'bandpass';
  bp2.frequency.value = 2600; bp2.Q.value = .9;
  const hg = actx.createGain(); hg.gain.value = .0022;
  hiss.connect(bp2); bp2.connect(hg); hg.connect(wetG); hiss.start();

/* 磬：非谐泛音，收细时高越 */
function chimeFreq(idx){
  return 587.33 * Math.pow(2, Math.floor(idx/5) + PENTA[idx%5]/12);
}
function playChime(idx, vel, pan){
  if(!actx || muted) return;
  const f = chimeFreq(idx)*(1+(Math.random()-.5)*.006);
  const t = actx.currentTime;
  const p = actx.createStereoPanner(); p.pan.value = clamp(pan,-1,1);
  p.connect(dryG); p.connect(wetG);
  const partials = [[1,1],[2.756,.32],[5.404,.13],[8.933,.045]];
  for(const [m,a] of partials){
    if(f*m > 15500) continue;
    const o = actx.createOscillator(); o.type = 'sine';
    o.frequency.value = f*m;
    const g = actx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.1*vel*a, t+.003);
    g.gain.exponentialRampToValueAtTime(.0001, t + 1.6/Math.pow(m,.45));
    o.connect(g); g.connect(p);
    o.start(t); o.stop(t+1.9);
  }
  const src = actx.createBufferSource(); src.buffer = noiseBuf(.05);
  const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
  const g = actx.createGain();
  g.gain.setValueAtTime(.01*vel, t);
  g.gain.exponentialRampToValueAtTime(.0001, t+.04);
  src.connect(hp); hp.connect(g); g.connect(p);
  src.start(t); src.stop(t+.06);
}
/* 古琴：低音散声，放宽时低回 */
function qinFreq(idx){
  return 82.41 * Math.pow(2, Math.floor(idx/5) + PENTA[idx%5]/12);
}
function playQin(idx, vel, pan, when){
  if(!actx || muted) return;
  const f = qinFreq(idx)*(1+(Math.random()-.5)*.004);
  const t = when || actx.currentTime;
  const p = actx.createStereoPanner(); p.pan.value = clamp(pan,-1,1);
  p.connect(dryG); p.connect(wetG);
  const gains = [1,.55,.34,.2,.12,.07];
  for(let m=1;m<=6;m++){
    if(f*m > 15000) continue;
    const o = actx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f*m*1.014, t);
    o.frequency.exponentialRampToValueAtTime(f*m, t+.16);
    const g = actx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.11*vel*gains[m-1], t+.012);
    g.gain.exponentialRampToValueAtTime(.0001, t + 2.6/Math.sqrt(m));
    o.connect(g); g.connect(p);
    o.start(t); o.stop(t+2.9);
  }
  const src = actx.createBufferSource(); src.buffer = noiseBuf(.04);
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = 900; bp.Q.value = 1;
  const g = actx.createGain();
  g.gain.setValueAtTime(.018*vel, t);
  g.gain.exponentialRampToValueAtTime(.0001, t+.05);
  src.connect(bp); bp.connect(g); g.connect(p);
  src.start(t); src.stop(t+.07);
}

const PALM_IDS = [0,5,9,13,17];   // 腕 + 四掌骨根：掌心质心，比单点稳
function onHands(res){
  const now = performance.now();
  const lms = res.multiHandLandmarks || [];
  for(let i=0; i<2; i++){
    const p = pointers[i];
    if(lms[i]){
      const L = lms[i];
      let sx = 0, sy = 0;
      for(const id of PALM_IDS){ sx += L[id].x; sy += L[id].y; }
      sx /= PALM_IDS.length; sy /= PALM_IDS.length;
      p.tx = (1-sx)*W; p.ty = sy*H;
      if(!p.active){ p.x = p.px = p.tx; p.y = p.py = p.ty; p.active = true; }
      p.seen = now;
    }
  }
}

/* ——— 成器分析：形之度量 · 静心统计 · 专属文案 ——— */
function analyzeShape(){
  let maxP = 0, maxI = 0;
  for(let i=0;i<SEG;i++){ if(prof[i]>maxP){ maxP=prof[i]; maxI=i; } }
  const widthPx = 2*maxP*maxR;
  const aspect  = vH/Math.max(1,widthPx);                 // 高宽比：>1.6 瘦高，<1 矮胖
  const rim     = prof[0];                                // 口沿
  const bellyU  = maxI/(SEG-1);                           // 腹部高度
  const neck    = Math.min.apply(null, prof.slice(0, Math.round(SEG*0.24)));
  const openness= rim/Math.max(.01,maxP);
  let rough = 0;
  for(let i=1;i<SEG-1;i++) rough += Math.abs(prof[i]-(prof[i-1]+prof[i+1])/2);
  return {aspect, rim, bellyU, neck, openness, rough, maxP};
}
function calmStats(){
  const overall = calmT>0 ? calmAcc/calmT : 1;
  const early = calmEarlyT>0 ? calmEarly/calmEarlyT : overall;
  const late  = calmLateT>0  ? calmLate/calmLateT   : overall;
  return {overall, early, late, trend: late-early};
}

    taleEn='Your hands stayed quick, as if with something to say; this tilted vessel keeps what went unspoken'; }

/* 极简标记：八角 · 轨 · 星（无印章）*/
function drawMark(c, cx, cy, R, col){
  c.save();
  c.strokeStyle = col; c.fillStyle = col; c.lineJoin = 'round';
  c.lineWidth = Math.max(1, R*0.045);
  c.globalAlpha = .75;
  c.beginPath();
  for(let k=0;k<8;k++){
    const a = (22.5 + k*45)*Math.PI/180;
    const px = cx + Math.cos(a)*R, py = cy + Math.sin(a)*R;
    k ? c.lineTo(px,py) : c.moveTo(px,py);
  }
  c.closePath(); c.stroke();
  c.globalAlpha = .5;
  c.beginPath(); c.ellipse(cx, cy, R*0.62, R*0.23, 0, 0, TAU); c.stroke();
  c.globalAlpha = .95;
  c.beginPath(); c.arc(cx, cy, R*0.1, 0, TAU); c.fill();
  c.globalAlpha = .8;
  c.beginPath(); c.arc(cx + R*0.62, cy, R*0.055, 0, TAU); c.fill();
  c.restore();
}
function ltext(c, str, x, y, size, ls, font, align){
  c.save();
  c.font = `${size}px ${font||'Georgia,serif'}`;
  let total = 0;
  for(const ch of str) total += c.measureText(ch).width + ls;
  total -= ls;
  let cx = align==='center' ? x-total/2 : x;
  for(const ch of str){
    c.fillText(ch, cx, y);
    cx += c.measureText(ch).width + ls;
  }
  c.restore();
}
/* 分行绘字：中文按字断，英文按词断 */
function wrapText(c, str, x, y, maxW, lh, align){
  const cjk = /[一-鿿　-〿＀-￯]/.test(str);
  const units = cjk ? Array.from(str) : str.split(' ');
  const join = cjk ? '' : ' ';
  const lines = []; let cur = '';
  for(const u of units){
    const test = cur ? cur+join+u : u;
    if(c.measureText(test).width > maxW && cur){ lines.push(cur); cur = u; }
    else cur = test;
  }
  if(cur) lines.push(cur);
  const prevAlign = c.textAlign;
  c.textAlign = align || 'center';
  for(let i=0;i<lines.length;i++) c.fillText(lines[i], x, y + i*lh);
  c.textAlign = prevAlign;
  return y + lines.length*lh;
}

  c.strokeStyle = 'rgba(200,164,95,.38)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(PW/2-54, 1232); c.lineTo(PW/2+54, 1232); c.stroke();

  /* 一语（依静心 × 形生成，克制留白）*/
  c.fillStyle = 'rgba(223,242,232,.92)';
  if(en){ c.font = 'italic 27px Georgia,serif'; c.fillText(copy.essenceEn, PW/2, 1290); }
  else { c.font = '28px "Kaiti SC","STKaiti","KaiTi",serif'; c.fillText(copy.essenceCn, PW/2, 1292); }
  c.fillStyle = 'rgba(200,164,95,.5)';
  if(en){ c.font = '17px "Kaiti SC","STKaiti",serif'; c.fillText(copy.essenceCn, PW/2, 1322); }
  else { c.font = 'italic 15px Georgia,serif'; c.fillText(copy.essenceEn, PW/2, 1324); }

  /* ——— 落款：心境 · 日期 · 时长 ——— */
  c.fillStyle = 'rgba(241,217,154,.5)';
  const meta = en
    ? `${mood.en}   ·   ${dateStr()}   ·   ${sessionMin} MIN`
    : `心境 ${mood.cn}   ·   ${dateStr()}   ·   静心 ${sessionMin} 分钟`;
  ltext(c, meta, PW/2, 1408, en?12.5:14, en?4:2,
    en?SANS:'"Songti SC","STSong",serif', 'center');

  /* 页脚 */
  c.fillStyle = 'rgba(200,164,95,.3)';
  c.textAlign = 'left';
  ltext(c, 'SOMATIC GARDEN', 82, PH-70, 10.5, 5, SANS);
  c.textAlign = 'right';
  c.font = `10.5px ${SANS}`;
  c.fillText('MMXXVI', PW-82, PH-70);
  c.textAlign = 'left';
}

/* ============================================================
   相 · 转 · 制：主循环
   ============================================================ */
const hintEl = { main:document.querySelector('#hint .main'), sub:document.querySelector('#hint .sub') };
let hintKey = '', curHint = null;
function setHint(key, zh, en){
  if(hintKey === key) return;
  hintKey = key; curHint = {zh, en}; renderHint();
}
function renderHint(){
  if(!curHint){ hintEl.main.textContent = ''; hintEl.sub.textContent = ''; return; }
  const primary = lang==='zh' ? curHint.zh : curHint.en;
  const secondary = lang==='zh' ? curHint.en : curHint.zh;
  hintEl.main.textContent = primary;
  hintEl.main.style.fontFamily = lang==='zh' ? 'var(--cn)' : 'var(--serif)';
  hintEl.main.style.fontStyle = lang==='zh' ? 'normal' : 'italic';
  hintEl.sub.textContent = secondary;
  hintEl.sub.style.fontFamily = lang==='zh' ? 'var(--serif)' : 'var(--cn)';
  hintEl.sub.style.fontStyle = lang==='zh' ? 'italic' : 'normal';
}

function startChoose(pl){
  chosen = pl.cfg;
  chooseAnim = { t0:performance.now(), x0:pl.x, y0:pl.y, r0:pl.r };
  vH = baseH; initProfile(); buildDust();   // 先备好球形素坯，供无缝化入
  spinSpd = 0;
  phase = 'chosen';
  playSelectArp();
}
function startThrow(mins){
  sessionMin = mins;
  sessionDur = mins*60; remainT = sessionDur;
  finishing = false; whiteA = 0;
  calmAcc = 0; calmT = 0; emaSpd = 0; anx = 0; wob = 0;
  calmEarly = 0; calmEarlyT = 0; calmLate = 0; calmLateT = 0; anxPeak = 0;
  vH = baseH; syncVessel();
  phase = 'throw';
  document.getElementById('btnFinish').style.display = '';
  toast(cameraMode ? T('tThrowCam') : T('tThrowDemo'));
}
function beginFinish(){
  if(finishing) return;
  finishing = true; finishT = performance.now();
  document.getElementById('btnFinish').style.display = 'none';
  playFinishChord();
}
function resetAll(){
  document.getElementById('posterWrap').classList.remove('on');
  document.getElementById('btnFinish').style.display = 'none';
  chosen = null; chooseAnim = null;
  finishing = false; whiteA = 0; spinSpd = 0; wob = 0;
  smoke.length = 0; sparks.length = 0; rings.length = 0; ptcls.length = 0;
  phase = 'select';
  toast(T('tAgain'));
}

function frame(now){
  requestAnimationFrame(frame);
  tick(now);
}
function tick(now){
  dtG = Math.min(.033, (now - timePrev)/1000);
  timePrev = now;
  if(!W) return;

  /* 指针平滑：自适应——静则重滤（不乱蹦），动则跟手（灵敏）*/
  for(const p of pointers){
    if(p.active && cameraMode && now - p.seen > 400){ p.active = false; p.trail.length = 0; }
    if(p.active){
      p.px = p.x; p.py = p.y;
      const dxT = p.tx - p.x, dyT = p.ty - p.y;
      const spd = Math.hypot(dxT, dyT);
      const a = cameraMode ? clamp(0.14 + spd*0.022, 0.14, 0.6) : 0.5;
      p.x += dxT*a; p.y += dyT*a;
    }
  }

  /* ——— 底色（青瓷冷调深空）——— */
  ctx.fillStyle = '#040706'; ctx.fillRect(0,0,W,H);
  const bg = ctx.createRadialGradient(W/2,H*.45,0,W/2,H*.45,Math.max(W,H)*.7);
  bg.addColorStop(0,'rgba(16,26,22,.5)');
  bg.addColorStop(.55,'rgba(8,14,12,.25)');
  bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  if(phase === 'veil'){
    renderRiver(now, .5);
    updatePlanets(now);
    renderPlanets(now, .4, null);
    return;
  }

  if(phase === 'select'){
    riverA += (1 - riverA)*Math.min(1, dtG*2);
    renderRiver(now, riverA);
    updatePlanets(now);
    let hoverKey = null;
    const P = activePointer();
    if(P){
      for(const pl of planets)
        if(Math.hypot(P.x-pl.x, P.y-pl.y) < pl.r*1.9){ hoverKey = pl.cfg.id; break; }
    }
    renderPlanets(now, 1, hoverKey);
    const done = updateDwell(dtG, planets.map(pl =>
      ({key:pl.cfg.id, x:pl.x, y:pl.y, rr:pl.r*1.9, pl})));
    renderDwell();
    if(done) startChoose(done.pl);
    renderPointersFx(now);
    setHint('sel', '以 手 掬 星 · 停 驻 即 取', 'Rest your hand on a world to gather it');
    return;
  }

  if(phase === 'chosen'){
    const u = clamp((now - chooseAnim.t0)/1500, 0, 1);
    const e = easeIO(u);
    riverA += (.2 - riverA)*Math.min(1, dtG*1.5);
    renderRiver(now, riverA);
    updatePlanets(now);
    renderPlanets(now, .2*(1-e)+.12, null);

    const midY = (vTop+vBot)/2;                 // 球坯赤道
    const x = lerp(chooseAnim.x0, vCx, e);
    const y = lerp(chooseAnim.y0, midY, e);
    const r = lerp(chooseAnim.r0, maxR, e);      // 缩至球坯半径，正好重合
    const clayA = clamp((u-.5)/.32, 0, 1);
    const planetA = 1 - clamp((u-.55)/.4, 0, 1);

    /* 球形素坯：星球落定即渐现（同为圆形，天衣无缝）*/
    if(clayA > 0){
      spinSpd = lerp(spinSpd, 1.1, dtG*2.2);
      rot += spinSpd*dtG;
      ctx.save(); ctx.globalAlpha = clayA;
      renderVesselLive(now);
      ctx.restore(); ctx.globalAlpha = 1;
    }
    /* 星球：悬落缩小、淡化入坯 */
    if(planetA > 0){
      const sp = sprites.get(chosen.id);
      const sc = r/sp.R;
      ctx.save();
      const gsz = r*4.2;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = planetA*.5;
      ctx.drawImage(chosen.cool?GLOW_BLUE:GLOW_GOLD, x-gsz/2, y-gsz/2, gsz, gsz);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = planetA;
      ctx.drawImage(sp.cvs, x - sp.cx*sc, y - sp.cy*sc, sp.cvs.width*sc, sp.cvs.height*sc);
      ctx.restore(); ctx.globalAlpha = 1;
    }

    if(u >= 1){
      buildDurCards();
      spawnSparks(vCx, midY, 1); spawnSparks(vCx, midY, .8);
      phase = 'duration';
    }
    updateFx(dtG); renderFx();
    setHint('cho', '星 落 轮 上 · 化 而 为 坯', 'The star settles on the wheel, becoming clay');
    return;
  }

  if(phase === 'duration'){
    renderRiver(now, .18);
    updatePlanets(now);
    spinSpd = lerp(spinSpd, .9, dtG*1.5);
    rot += spinSpd*dtG;
    renderVesselLive(now);
    ctx.fillStyle = 'rgba(2,2,5,.55)'; ctx.fillRect(0,0,W,H);
    renderDurCards(now);
    const done = updateDwell(dtG, durCards);
    renderDwell();
    if(done) startThrow(done.min);
    renderPointersFx(now);
    setHint('dur', '香 燃 一 炷 · 器 成 一 世', 'While the incense burns, a vessel is born');
    return;
  }

  if(phase === 'throw' || phase === 'done'){
    renderRiver(now, .13);
    updatePlanets(now);

    if(phase === 'throw'){
      if(!finishing){
        remainT -= dtG;
        spinSpd = lerp(spinSpd, 2.6 + anx*1.2, dtG*1.2);
        updateShaping(now, dtG);
        if(remainT <= 0) beginFinish();
      } else {
        const fu = (now - finishT)/1000;
        spinSpd = lerp(spinSpd, 0, Math.min(1, dtG*1.4));
        wob = lerp(wob, 0, Math.min(1, dtG*2));
        anx = lerp(anx, 0, Math.min(1, dtG*2));
        setShapeNoise(0);
        whiteA = fu < 1.9 ? 0 : clamp((fu-1.9)/.45, 0, 1);
        if(fu >= 2.6){
          makePoster();
          document.getElementById('posterWrap').classList.add('on');
          phase = 'done';
          whiteA = 0;
        }
      }
      rot += spinSpd*dtG;
      setHum(spinSpd);
    } else {
      spinSpd = lerp(spinSpd, .35, dtG);
      rot += spinSpd*dtG;
      setHum(0);
    }

    renderVesselLive(now);
    updateFx(dtG); renderFx();
    if(phase === 'throw'){
      renderIncense(now, dtG);
      renderPointersFx(now);
      /* 心浮则边缘泛红 */
      if(anx > .05){
        ctx.save();
        const rg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.72);
        rg.addColorStop(0,'rgba(160,40,26,0)');
        rg.addColorStop(1,`rgba(160,40,26,${.24*anx})`);
        ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
        ctx.restore();
      }
      if(whiteA > 0){
        ctx.fillStyle = `rgba(226,240,233,${whiteA*.9})`;
        ctx.fillRect(0,0,W,H);
      }
      if(finishing)
        setHint('fin', '轮 息 器 成 · 星 尘 落 定', 'The wheel rests; stardust settles into form');
      else if(anx > .5)
        setHint('anx', '慢 一 些 · 心 静 则 圆', 'Slower — stillness makes the circle true');
      else
        setHint('thr', '收 拢 成 颈 · 张 开 成 腹 · 缓 则 圆 成', 'Draw in for the neck, open for the belly; slowness makes it whole');
    }
    return;
  }
}

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = W*DPR; cvs.height = H*DPR;
  cvs.style.width = W+'px'; cvs.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildSprites();
  vesselLayout();
  buildRiver();
  if(durCards.length) buildDurCards();
  if(!prof.length) initProfile();
  if(!dust.length) buildDust();
}

/* ============================================================
   入场 · 控件
   ============================================================ */
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = 1;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.opacity = 0, 3600);
}

/* ——— 语言应用 EN / 中 ——— */
const $ = id => document.getElementById(id);
function refreshModeBtn(){ $('btnMode').textContent = cameraMode ? T('mode') : T('modeDemo'); }
function applyLang(){
  document.querySelectorAll('.lang span[data-l]').forEach(s =>
    s.classList.toggle('on', s.dataset.l === lang));
  document.documentElement.lang = lang==='zh' ? 'zh-Hant' : 'en';
  $('vTitle').textContent = lang==='en' ? 'COSMIC POTTERY' : '星河拉坯';
  $('vTitleSub').textContent = lang==='en' ? '星河拉坯' : 'COSMIC POTTERY';
  $('vTitle').style.fontFamily = lang==='en' ? 'var(--sans)' : 'var(--cn)';
  $('vTitleSub').style.fontFamily = lang==='en' ? 'var(--cn)' : 'var(--sans)';
  $('vTag').innerHTML = T('tag');
  $('vTag').style.fontFamily = lang==='zh' ? 'var(--cn)' : 'var(--serif)';
  $('vTag').style.fontStyle = lang==='zh' ? 'normal' : 'italic';
  $('vTag2').innerHTML = T('tag2');
  $('vTag2').style.fontFamily = lang==='zh' ? 'var(--cn)' : 'var(--serif)';
  $('btnCamMain').textContent = T('cam'); $('btnCamSub').textContent = T('camSub');
  $('btnDemoMain').textContent = T('demo'); $('btnDemoSub').textContent = T('demoSub');
  $('vPriv').textContent = T('priv');
  document.querySelector('#ctrl .privacy').textContent = T('privShort');
  $('btnFinish').textContent = T('finish');
  refreshModeBtn();
  $('btnMute').textContent = muted ? T('soundOff') : T('sound');
  $('btnMirror').textContent = T('mirror');
  $('btnSave').textContent = T('save');
  $('btnAgain').textContent = T('again');
  $('pCap').textContent = T('cap');
  /* 引文（诗）*/
  const pm = document.querySelector('#poem .main'),
        ps = document.querySelector('#poem .sub'),
        pr = document.querySelector('#poem .src');
  if(lang === 'en'){
    pm.textContent = 'Clay is thrown into a vessel —';
    pm.style.fontFamily = 'var(--serif)'; pm.style.fontStyle = 'italic';
    ps.textContent = 'the emptiness within gives it use.';
    pr.textContent = 'TAO TE CHING · XI';
  } else {
    pm.textContent = '埏埴以为器，';
    pm.style.fontFamily = 'var(--cn)'; pm.style.fontStyle = 'normal';
    ps.textContent = '当其无，有器之用。';
    pr.textContent = '《道德经》第十一章';
  }
  renderHint();
}
function setLang(l){ if(l === lang) return; lang = l; applyLang(); }
document.querySelectorAll('.lang span[data-l]').forEach(s =>
  s.addEventListener('click', () => setLang(s.dataset.l)));

function begin(withCam){
  if(started) return;
  started = true;
  initAudio();
  document.getElementById('veil').classList.add('gone');
  $('langHud').style.display = 'flex';
  phase = 'select';
  if(withCam){
    cameraMode = true; refreshModeBtn();
    initCamera().catch(err => {
      console.warn('camera failed', err);
      cameraMode = false; refreshModeBtn();
      toast(T('tCamFail'));
    });
  } else {
    cameraMode = false; refreshModeBtn();
    toast(T('tDemoOn'));
  }
}
document.getElementById('btnCam').addEventListener('click', () => begin(true));
document.getElementById('btnDemo').addEventListener('click', () => begin(false));

document.getElementById('btnMute').addEventListener('click', e => {
  muted = !muted;
  if(master) master.gain.value = muted ? 0 : .9;
  e.currentTarget.textContent = muted ? T('soundOff') : T('sound');
  e.currentTarget.classList.toggle('off', muted);
});
document.getElementById('btnMirror').addEventListener('click', e => {
  const v = document.getElementById('cam');
  const off = v.style.visibility === 'hidden';
  v.style.visibility = off ? 'visible' : 'hidden';
  e.currentTarget.classList.toggle('off', !off);
});
document.getElementById('btnMode').addEventListener('click', async e => {
  if(!started) return;
  if(cameraMode){
    cameraMode = false; refreshModeBtn();
    toast(T('tDemo'));
  } else {
    cameraMode = true; refreshModeBtn();
    if(!mpCamera){
      try { await initCamera(); }
      catch(err){ cameraMode = false; refreshModeBtn(); toast(T('tCamFail')); }
    }
    if(cameraMode) toast(T('tCamOn'));
  }
});
document.getElementById('btnFinish').addEventListener('click', () => {
  if(phase === 'throw') beginFinish();
});
document.getElementById('btnSave').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = `cosmic-pottery-${chosen ? chosen.id : 'vessel'}-${dateStr().replaceAll('.','')}.png`;
  a.href = posterCvs.toDataURL('image/png');
  a.click();
  toast(T('tSaved'));
});
document.getElementById('btnAgain').addEventListener('click', resetAll);
applyLang();

/* 鼠标 / 触摸（演示模式，摄像模式下也可救场） */
window.addEventListener('mousemove', e => {
  const p = pointers[0];
  p.tx = e.clientX; p.ty = e.clientY;
  if(!p.active){ p.x = p.px = p.tx; p.y = p.py = p.ty; p.active = true; }
  if(!cameraMode) p.seen = performance.now();
});
window.addEventListener('mousedown', e => {
  pdown = true;
  const p = pointers[0];
  p.tx = e.clientX; p.ty = e.clientY;
  if(!p.active){ p.x = p.px = p.tx; p.y = p.py = p.ty; p.active = true; }
  /* 点击亦可直取（演示模式的快径） */
  if(phase === 'select'){
    for(const pl of planets)
      if(Math.hypot(p.tx-pl.x, p.ty-pl.y) < pl.r*1.9){ startChoose(pl); break; }
  } else if(phase === 'duration'){
    for(const cd of durCards)
      if(p.tx>cd.x0 && p.tx<cd.x1 && p.ty>cd.y0 && p.ty<cd.y1){ startThrow(cd.min); break; }
  }
});
window.addEventListener('mouseup', () => { pdown = false; });
window.addEventListener('touchstart', e => {
  const t = e.touches[0]; if(!t) return;
  pdown = true;
  const p = pointers[0];
  p.tx = t.clientX; p.ty = t.clientY;
  if(!p.active){ p.x = p.px = p.tx; p.y = p.py = p.ty; p.active = true; }
  p.seen = performance.now();
}, { passive:true });
window.addEventListener('touchmove', e => {
  const t = e.touches[0]; if(!t) return;
  const p = pointers[0];
  p.tx = t.clientX; p.ty = t.clientY;
  if(!p.active){ p.x = p.px = p.tx; p.y = p.py = p.ty; p.active = true; }
  p.seen = performance.now();
}, { passive:true });
window.addEventListener('touchend', () => { pdown = false; });

/* 布展调试口（不入正观） */
window.__cp = {
  tick,
  get phase(){ return phase; },
  get planets(){ return planets.map(p => ({id:p.cfg.id, x:p.x, y:p.y, r:p.r})); },
  get calm(){ return calmT ? calmAcc/calmT : 1; },
  get prof(){ return prof.slice(); },
  get vH(){ return vH; },
  get maxR(){ return maxR; },
  get anx(){ return anx; },
  setProf(fn){ for(let i=0;i<SEG;i++) prof[i] = clamp(fn(i/(SEG-1), prof[i]), MINRN, 1); },
  setVH(px){ vH = clamp(px, vHMin, vHMax); syncVessel(); },
  setCalm(o){ calmAcc=o.acc; calmT=o.t; calmEarly=o.e; calmEarlyT=o.et; calmLate=o.l; calmLateT=o.lt; },
  copy(){ return composeCopy(); },
  setCam(b){ cameraMode = b; },
  hand(i, x, y){ const p = pointers[i]; p.px = p.x; p.py = p.y; p.x = p.tx = x; p.y = p.ty = y; p.active = true; p.seen = performance.now(); },
  handOff(i){ pointers[i].active = false; },
  rawShape(dt){ updateShaping(performance.now(), dt); },
  choose(id){ if(phase!=='select') return; const i = planets.findIndex(p=>p.cfg.id===id); startChoose(planets[i<0?0:i]); },
  chooseIdx(i){ if(phase==='select') startChoose(planets[i%planets.length]); },
  dur(m){ if(phase==='duration') startThrow(m); },
  finish(){ if(phase==='throw') beginFinish(); }
};

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
